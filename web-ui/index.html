<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseAudio MP3 Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="background-glow"></div>
  
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18V5l12-2v13" />
            <circle cx="6" cy="18" r="3" />
            <circle cx="18" cy="16" r="3" />
          </svg>
        </div>
        <h1>AudioPulse <span>Daemon</span></h1>
      </div>

      <div class="header-actions">
        <button id="bt-modal-btn" class="icon-btn-pill" title="Bluetooth Devices">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M7 7l10 10-5 5V2l5 5L7 17" />
          </svg>
          <span id="bt-status-badge" class="badge badge-disconnected">BT Off</span>
        </button>

        <button id="rescan-btn" class="icon-btn-pill" title="Rescan Music Folder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />
          </svg>
          <span>Rescan</span>
        </button>
      </div>
    </header>

    <!-- Main Content Layout -->
    <main class="player-grid">
      <!-- Left / Top: Now Playing Card -->
      <section class="player-card">
        <div class="album-art-wrapper">
          <div id="vinyl-disc" class="vinyl-disc">
            <div class="vinyl-grooves"></div>
            <div class="vinyl-center">
              <div class="vinyl-hole"></div>
            </div>
          </div>
          <div class="cover-art" id="cover-art">
            <svg class="cover-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M9 18V5l12-2v13" />
              <circle cx="6" cy="18" r="3" />
              <circle cx="18" cy="16" r="3" />
            </svg>
          </div>
        </div>

        <!-- Track Info -->
        <div class="track-info">
          <h2 id="track-title" class="track-title">No Track Loaded</h2>
          <p id="track-artist" class="track-artist">Select a track from the playlist</p>
          <p id="track-album" class="track-album">MP3 Player</p>
        </div>

        <!-- Audio Visualizer Animation -->
        <div id="visualizer" class="visualizer-bars">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>

        <!-- Time Scrub Bar -->
        <div class="progress-section">
          <div class="time-display">
            <span id="time-current">0:00</span>
            <span id="time-duration">0:00</span>
          </div>
          <div class="seeker-wrapper">
            <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.1">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
        </div>

        <!-- Playback Controls -->
        <div class="controls-row">
          <button id="shuffle-btn" class="control-btn toggle-btn" title="Toggle Shuffle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="16 3 21 3 21 8" />
              <line x1="4" y1="20" x2="21" y2="3" />
              <polyline points="21 16 21 21 16 21" />
              <line x1="15" y1="15" x2="21" y2="21" />
              <line x1="4" y1="4" x2="9" y2="9" />
            </svg>
          </button>

          <button id="prev-btn" class="control-btn" title="Previous Track">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <polygon points="19 20 9 12 19 4 19 20" />
              <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2" />
            </svg>
          </button>

          <button id="play-btn" class="control-btn play-main-btn" title="Play / Pause">
            <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3" />
            </svg>
            <svg id="pause-icon" class="hidden" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="4" width="4" height="16" />
              <rect x="14" y="4" width="4" height="16" />
            </svg>
          </button>

          <button id="next-btn" class="control-btn" title="Next Track">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 4 15 12 5 20 5 4" />
              <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2" />
            </svg>
          </button>

          <button id="repeat-btn" class="control-btn toggle-btn" title="Toggle Repeat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="17 1 21 5 17 9" />
              <path d="M3 11V9a4 4 0 0 1 4-4h14" />
              <polyline points="7 23 3 19 7 15" />
              <path d="M21 13v2a4 4 0 0 1-4 4H3" />
            </svg>
            <span id="repeat-badge" class="mini-badge">OFF</span>
          </button>
        </div>

        <!-- Volume Control -->
        <div class="volume-container">
          <svg class="vol-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" />
          </svg>
          <input type="range" id="volume-slider" min="0" max="100" value="80">
          <span id="volume-label" class="vol-label">80%</span>
        </div>
      </section>

      <!-- Right / Bottom: Playlist Directory -->
      <section class="playlist-card">
        <div class="playlist-header">
          <div class="playlist-title">
            <h3>Library Tracks</h3>
            <span id="track-count-badge" class="count-badge">0 songs</span>
          </div>
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" id="playlist-search" placeholder="Search playlist...">
          </div>
        </div>

        <div class="playlist-scroll">
          <ul id="playlist-items" class="playlist-items">
            <!-- Playlist items loaded dynamically via app.js -->
          </ul>
        </div>
      </section>
    </main>
  </div>

  <!-- Bluetooth Modal -->
  <div id="bt-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content glass-card">
      <div class="modal-header">
        <h3>Bluetooth Audio Devices</h3>
        <button id="bt-modal-close" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div id="bt-connected-info" class="bt-connected-info">
          <span class="label">Status:</span>
          <span id="bt-connected-text" class="value">Searching...</span>
        </div>
        <h4>Paired Devices</h4>
        <ul id="bt-device-list" class="bt-device-list">
          <!-- Devices populated dynamically -->
        </ul>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
